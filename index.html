<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <!-- ===== RECORDS ===== -->
        <div id="records-box" class="records-box hidden">
          <div id="records-entry" class="records-entry hidden">
            <p id="records-new-msg"></p>
            <div class="records-entry-row">
              <input id="records-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" />
              <button id="records-save" type="button">Guardar</button>
            </div>
          </div>
          <table id="records-table" class="records-table"></table>
          <p id="records-stats" class="records-stats"></p>
          <button type="button" class="reset-records-btn">Resetear records</button>
        </div>
        <!-- ===== FIN RECORDS ===== -->
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- ===== RECORDS: pantalla de inicio ===== -->
    <div id="start-overlay" class="overlay hidden">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>
        <p class="records-heading">MEJORES PUNTUACIONES</p>
        <table id="start-records-table" class="records-table"></table>
        <p id="start-records-stats" class="records-stats"></p>
        <button id="play-btn" type="button">Jugar</button>
        <button type="button" class="reset-records-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
